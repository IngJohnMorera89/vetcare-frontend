<section class="login-tarjeta">
  <h1 class="login-titulo">Iniciar sesión en VetCare</h1>

  @if (error()) {
    <p class="estado-error">{{ error() }}</p>
  }

  <form class="login-form" (submit)="ingresar($event, inputUsername, inputPassword)">
    <input #inputUsername type="text" placeholder="Usuario" required>
    <input #inputPassword type="password" placeholder="Contraseña" required>
    <button type="submit" class="login-boton">Ingresar</button>
  </form>

  <p style="text-align:center; margin-top: var(--espacio-sm);">
    ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
  </p>
</section>
