@if (mascota(); as m) {
  <section class="detalle">
    <div class="detalle-foto-contenedor">
      <img class="detalle-foto" [src]="m.foto" [alt]="'Foto de ' + m.nombre" />
      <button
        class="favorito-boton-detalle"
        type="button"
        [attr.aria-pressed]="esFavorito()"
        [attr.aria-label]="esFavorito() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        (click)="alternarFavorito()"
      >
        <span class="favorito-icono" [class.activo]="esFavorito()">♥</span>
      </button>
    </div>
    <div class="detalle-info">
      <h1 class="detalle-nombre">{{ m.nombre }}</h1>
      <p class="detalle-dato"><strong>Especie:</strong> {{ m.especie }}</p>
      <p class="detalle-dato"><strong>Edad:</strong> {{ m.edad }} años</p>
      <p class="detalle-dato"><strong>Dueño:</strong> {{ m.dueno }}</p>
      <a routerLink="/mascotas" class="volver">← Volver al listado</a>
    </div>
  </section>
} @else {
  <p class="sin-resultado">No se encontró la mascota solicitada.</p>
}
